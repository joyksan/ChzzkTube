[project]
name = "chzzktube"
version = "3.1.0"
description = "YouTube/치지직 영상 다운로더 GUI (PyQt6 + yt-dlp + streamlink)"
requires-python = ">=3.12"
# 앱 버전의 단일 출처는 config._APP_VERSION (bump_version.py 관리) — 이 version은 메타 참고용
dependencies = [
    "PyQt6==6.11.0",
    "yt-dlp==2026.8.19",
    "streamlink==8.5.0",
    "bgutil-ytdlp-pot-provider==1.3.2",
]

[dependency-groups]
# Windows 빌드(PyInstaller)용 — uv sync --group build
build = ["pyinstaller"]

[tool.uv]
# 앱 프로젝트 — 패키지로 빌드/배포하지 않으므로 uv run 때마다 프로젝트를 빌드하지 않는다
package = false
