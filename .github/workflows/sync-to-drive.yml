name: Sync Markdown Mirrors to Google Drive

on:
  workflow_dispatch:
  push:
    branches:
      - main  # master 사용 시 master로 수정
    paths:
      - '**.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.1.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.12'

      # mirrors/chzzktube_codebase.md 번들 생성 (sync_mirrors.py 재사용)
      - name: Generate Mirrors & Codebase Bundle
        run: |
          python sync_mirrors.py

      - name: Install Rclone
        run: |
          sudo curl https://rclone.org/install.sh | sudo bash

      - name: Create Rclone Config
        run: |
          mkdir -p ~/.config/rclone
          cat << EOL > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive
          token = ${{ secrets.RCLONE_GDRIVE_TOKEN }}
          root_folder_id = ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          EOL

      # mirrors/** (합본 + 개별 미러) 및 루트 문서 동기화
      - name: Sync Markdown files to Google Drive
        run: |
          rclone sync . gdrive: \
            --include "mirrors/**" \
            --include "README.md" \
            --include "CHANGELOG.md" \
            --include "HANDOVER.md" \
            --exclude "*" \
            --delete-excluded \
            --transfers 8 \
            --checkers 16 \
            --fast-list \
            --progress