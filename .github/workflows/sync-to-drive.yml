name: Sync Markdown Mirrors to Google Drive

on:
  push:
    branches:
      - main  # master를 사용 중이시라면 master로 변경
    paths:
      - '**.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup rclone
        uses: AnimMouse/setup-rclone-action@v1

      - name: Create Keys and Rclone Config
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa.json
          mkdir -p ~/.config/rclone
          cat << EOL > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive
          service_account_file = /tmp/sa.json
          root_folder_id = ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          EOL

      - name: Sync Markdown files to Google Drive
        run: |
          rclone sync . gdrive: --include "*.md" --exclude ".git/**" --progress
