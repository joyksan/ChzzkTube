name: Sync Markdown Mirrors to Google Drive

on:
  workflow_dispatch:
  push:
    branches:
      - main  # master 사용 시 master로 수정
    paths:
      - '**.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Create Rclone Config
        run: |
          mkdir -p ~/.config/rclone
          cat << EOL > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive
          token = ${{ secrets.RCLONE_GDRIVE_TOKEN }}
          root_folder_id = ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          EOL

      - name: Sync Markdown files to Google Drive
        run: |
          rclone sync . gdrive: --include "*.md" --exclude ".git/**" --progress