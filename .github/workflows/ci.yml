name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'mirrors/**'
      - '.github/workflows/sync-drive.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'mirrors/**'

# 연속 푸시 시 이전 진행 중이던 테스트 작업 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    env:
      QT_QPA_PLATFORM: offscreen  # headless Qt 실행

    steps:
      - uses: actions/checkout@v5.1.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Run unit and integration tests
        run: uv run python -m pytest tests/ -v --tb=short