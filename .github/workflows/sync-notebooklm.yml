name: Sync Codebase to NotebookLM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bundle codebase with Repomix
        run: npx repomix --output repomix-output.md

      - name: Sync to NotebookLM
        env:
          NOTEBOOK_ID: ${{ secrets.NOTEBOOK_ID }}
          NOTEBOOKLM_COOKIES: ${{ secrets.NOTEBOOKLM_COOKIES }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install notebooklm-py
          python -m notebooklm sync --notebook-id "$NOTEBOOK_ID" --cookies "$NOTEBOOKLM_COOKIES" --file repomix-output.md