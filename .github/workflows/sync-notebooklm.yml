name: Sync Codebase to NotebookLM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bundle codebase with Repomix
        run: npx repomix --output repomix-output.md

      - name: Sync to NotebookLM
        env:
          NOTEBOOK_ID: ${{ secrets.NOTEBOOK_ID }}
          NOTEBOOKLM_COOKIES: ${{ secrets.NOTEBOOKLM_COOKIES }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install notebooklm-py
          
          python -c "
          import os, sys
          from notebooklm import NotebookLM

          notebook_id = os.environ.get('NOTEBOOK_ID', '').strip()
          cookies_str = os.environ.get('NOTEBOOKLM_COOKIES', '').strip()

          if not notebook_id or not cookies_str:
              print('❌ Error: NOTEBOOK_ID 또는 NOTEBOOKLM_COOKIES Secret이 비어있습니다.')
              sys.exit(1)

          try:
              client = NotebookLM(cookies=cookies_str)
              client.add_source(notebook_id=notebook_id, file_path='repomix-output.md')
              print('✅ NotebookLM 동기화 성공!')
          except Exception as e:
              print(f'❌ 동기화 실패: {e}')
              sys.exit(1)
          "