name: Sync Codebase to NotebookLM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bundle codebase with Repomix
        run: npx repomix --output repomix-output.md

      - name: Sync to NotebookLM
        env:
          NOTEBOOK_ID: ${{ secrets.NOTEBOOK_ID }}
          NOTEBOOKLM_COOKIES: ${{ secrets.NOTEBOOKLM_COOKIES }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install notebooklm-py
          
          python -c "
          import asyncio, json, os, sys, traceback
          from notebooklm import NotebookLMClient

          async def main():
              notebook_id = os.environ.get('NOTEBOOK_ID', '').strip()
              raw_cookies = os.environ.get('NOTEBOOKLM_COOKIES', '').strip()

              if not notebook_id or not raw_cookies:
                  print('❌ Error: NOTEBOOK_ID 또는 NOTEBOOKLM_COOKIES Secret이 비어있습니다.')
                  sys.exit(1)

              # 1. 줄바꿈 및 탭 정제
              clean_cookies_str = raw_cookies.replace('\r', ' ').replace('\n', ' ').replace('\t', ' ')
              
              cookie_dict = {}
              for item in clean_cookies_str.split(';'):
                  item = item.strip()
                  if not item or '=' not in item:
                      continue
                  k, v = item.split('=', 1)
                  k = k.strip()
                  v = v.strip()
                  if k and v:
                      cookie_dict[k] = v

              # 2. 필수 인증 키 별칭(Alias) 맵핑
              if 'SID' not in cookie_dict and '__Secure-1PSID' in cookie_dict:
                  cookie_dict['SID'] = cookie_dict['__Secure-1PSID']
              if 'SSID' not in cookie_dict and '__Secure-1PSSID' in cookie_dict:
                  cookie_dict['SSID'] = cookie_dict['__Secure-1PSSID']
              if 'APISID' not in cookie_dict and '__Secure-1PAPISID' in cookie_dict:
                  cookie_dict['APISID'] = cookie_dict['__Secure-1PAPISID']
              if 'SAPISID' not in cookie_dict and '__Secure-3PAPISID' in cookie_dict:
                  cookie_dict['SAPISID'] = cookie_dict['__Secure-3PAPISID']
              elif 'SAPISID' not in cookie_dict and '__Secure-1PAPISID' in cookie_dict:
                  cookie_dict['SAPISID'] = cookie_dict['__Secure-1PAPISID']
              if 'OSID' not in cookie_dict and '__Secure-OSID' in cookie_dict:
                  cookie_dict['OSID'] = cookie_dict['__Secure-OSID']

              print(f'🔑 정제된 쿠키 개수: {len(cookie_dict)}개')
              key_check = [k for k in ['SID', 'OSID', 'SAPISID', 'APISID', 'HSID'] if k in cookie_dict]
              print(f'🔍 감지된 핵심 인증 키: {key_check}')

              # 3. 도메인 스코프 분리 (CookieMismatch 해결)
              cookies_list = []
              for k, v in cookie_dict.items():
                  # OSID 및 NotebookLM 전용 쿠키는 notebook.google.com에만 바인딩
                  if 'OSID' in k:
                      domain = '.notebook.google.com'
                  else:
                      domain = '.google.com'

                  cookies_list.append({
                      'name': k,
                      'value': v,
                      'domain': domain,
                      'path': '/',
                      'expires': -1,
                      'httpOnly': False,
                      'secure': True,
                      'sameSite': 'None'
                  })

              storage_dir = os.path.expanduser('~/.notebooklm/profiles/default')
              os.makedirs(storage_dir, exist_ok=True)
              storage_path = os.path.join(storage_dir, 'storage_state.json')

              with open(storage_path, 'w', encoding='utf-8') as f:
                  json.dump({'cookies': cookies_list, 'origins': []}, f)

              print('🔑 인증 세션 파일 구성 완료!')

              # 4. NotebookLM API 호출
              try:
                  async with NotebookLMClient.from_storage(storage_path) as client:
                      print('📤 NotebookLM에 repomix-output.md 업로드 중...')
                      await client.sources.add_file(notebook_id, 'repomix-output.md')
                      print('✅ NotebookLM 동기화 성공!')
              except Exception as e:
                  print(f'❌ 동기화 실패: {e}')
                  traceback.print_exc()
                  sys.exit(1)

          asyncio.run(main())
          "